@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&family=Caveat:wght@600&display=swap');

* { box-sizing: border-box; }

html, body, #root { height: 100%; margin: 0; }

.phone {
  position: relative;
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  background: #F4E9D8;
  overflow: hidden;
  font-family: 'Quicksand', sans-serif;
  color: #3B2314;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* Dentro do preview de navegador (tela larga), mant\xE9m o visual de "celular
   emoldurado" para ficar bonito na demonstra\xE7\xE3o \u2014 mas dentro do app Android
   de verdade (tela estreita, \xE9 a tela toda) isso n\xE3o se aplica, ele preenche
   a tela inteira sem moldura. */
@media (min-width: 560px) {
  .page { padding: 24px 12px; background: #E7DCC8; }
  .phone {
    min-height: 800px;
    border-radius: 40px;
    box-shadow: 0 30px 60px -20px rgba(59, 35, 20, 0.35);
  }
}

.screen { flex: 1; overflow-y: auto; padding-bottom: 100px; }
.loading-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.loading-text { font-family: 'Fraunces', serif; font-size: 14px; opacity: 0.7; }
.save-warning { position: fixed; top: 0; left: 0; right: 0; background: #C0392B; color: white; font-size: 10.5px; padding: 6px 14px; display: flex; align-items: center; gap: 6px; justify-content: center; z-index: 20; }

.hero { position: relative; background: linear-gradient(160deg, #6B4428 0%, #3B2314 100%); padding: 30px 24px 34px; color: #F4E9D8; border-radius: 0 0 46% 46% / 0 0 60px 60px; overflow: hidden; }
.hero-arc { position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; border: 1px dashed rgba(244, 233, 216, 0.35); border-radius: 50%; }
.hero-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
.hero-logo { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(244, 233, 216, 0.5); box-shadow: 0 10px 22px -6px rgba(0,0,0,0.4); margin-bottom: 12px; }
.hero-title { font-family: 'Caveat', cursive; font-size: 40px; line-height: 1; margin: 0 0 4px; color: #F4E9D8; }
.hero-sub { font-family: 'Fraunces', serif; font-size: 15px; margin: 0 0 18px; opacity: 0.9; }
.stat-blob { width: 168px; border-radius: 44px; background: #E3A83B; color: #3B2314; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; box-shadow: 0 14px 24px -8px rgba(59,35,20,0.45); }
.stat-number { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; line-height: 1; }
.stat-label { font-size: 11.5px; font-weight: 700; white-space: nowrap; }

.top-logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; margin-left: auto; border: 2px solid #EFDFC4; }

.actions { padding: 30px 20px 10px; display: flex; flex-direction: column; gap: 14px; }
.action { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: none; border-radius: 24px; background: #EFDFC4; cursor: pointer; text-align: left; transition: transform 0.15s ease; }
.action:hover { transform: translateY(-2px); }
.action-primary { background: linear-gradient(135deg, #C97C3F, #A85D2A); color: #F4E9D8; }

/* ===== Ajustes para iPhone / iPad / Android ===== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
button, select, input, textarea, label { touch-action: manipulation; }
button { font-family: inherit; }
@supports (-webkit-touch-callout: none) {
  input, select, textarea { font-size: 16px !important; }
}
@media (hover: none) { .nota-copy:hover, .scope-card:hover { filter: none; } }

/* ===== Telas grandes: iPad, notebook, desktop (ocupa a tela toda) ===== */
@media (min-width: 560px) {
  .page { padding: 0 !important; background: #F4E9D8 !important; }
  .phone { max-width: none; width: 100%; min-height: 100vh; min-height: 100dvh; border-radius: 0; box-shadow: none; overflow: visible; }
  .screen { max-width: 760px; width: 100%; margin: 0 auto; }
}
@media (min-width: 820px) {
  .phone { padding-left: 244px; }
  .bottom-nav { left: 16px; top: 16px; bottom: 16px; transform: none; width: 212px; flex-direction: column; justify-content: flex-start; gap: 6px; padding: 22px 12px; border-radius: 32px; }
  .nav-item { flex-direction: row; gap: 14px; font-size: 14.5px; font-weight: 600; padding: 13px 16px; width: 100%; justify-content: flex-start; border-radius: 18px; }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-label { display: inline; white-space: nowrap; text-align: left; }
  .nav-short { display: none; }
  .screen { max-width: 1180px; padding: 0 28px 48px; }
  .hero { border-radius: 36px; margin-top: 20px; padding: 40px 24px 44px; }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); padding: 26px 0 10px; }
  .people-list, .historico-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); padding-left: 0; padding-right: 0; }
  .report-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .scope-grid { grid-template-columns: repeat(5, 1fr); padding: 0; }
  .scope-card:last-child:nth-child(odd) { grid-column: auto; }
  .scope-month, .form-card, .timeline, .timeline-title, .section-label { margin-left: 0 !important; margin-right: 0 !important; }
  .form-card { max-width: 720px; }
  .nota { max-width: 760px; margin: 22px auto 0; }
  .pdf-btn-row { max-width: 760px; margin-left: auto !important; margin-right: auto !important; padding: 0; }
  .chart-card { max-width: 760px; }
  .toast { left: calc(50% + 122px); }
}
